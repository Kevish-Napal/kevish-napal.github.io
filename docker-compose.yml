# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:latest
    build: .
    command: /srv/jekyll/bin/entry_point.sh
    # uncomment these if you are having this issue with the build:
    # /usr/local/bundle/gems/jekyll-4.3.4/lib/jekyll/site.rb:509:in `initialize': Permission denied @ rb_sysopen - /srv/jekyll/.jekyll-cache/.gitignore (Errno::EACCES)
    # and fill the args values with the output of the commands on the right
    # build:
    #   args:
    #     GROUPID: # id -g
    #     GROUPNAME: # id -gn
    #     USERID: # id -u
    #     USERNAME: # echo $USER
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
    develop:
      watch:
        # content/config edits are already synced live via the bind mount above
        # and picked up by jekyll's own --watch/--force_polling + livereload.
        # Only Gemfile/Dockerfile changes need a full image rebuild.
        - action: rebuild
          path: ./Gemfile
        - action: rebuild
          path: ./Gemfile.lock
        - action: rebuild
          path: ./Dockerfile
